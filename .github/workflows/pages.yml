name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - friscy-bundle/**
      - .github/workflows/pages.yml
      - .gitattributes
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate LFS files are resolved (not pointer stubs)
        run: |
          echo "Checking that all LFS-tracked files in friscy-bundle/ are resolved..."
          fail=0
          count=0
          for f in friscy-bundle/*.wasm friscy-bundle/*.tar friscy-bundle/*.ckpt; do
            [ -f "$f" ] || continue
            count=$((count + 1))
            if head -c 40 "$f" | grep -q 'version https://git-lfs'; then
              echo "ERROR: $f is an unresolved LFS pointer ($(wc -c < "$f") bytes)"
              fail=1
            else
              size=$(stat --format=%s "$f")
              echo "OK: $f ($size bytes)"
            fi
          done
          echo "Checked $count files."
          if [ "$count" -eq 0 ]; then
            echo "WARNING: No LFS-tracked files found in friscy-bundle/"
          fi
          if [ "$fail" -eq 1 ]; then
            echo ""
            echo "Deploy blocked: LFS files were not resolved."
            echo "Run 'git lfs pull' and re-push, or check LFS bandwidth."
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: friscy-bundle
      - id: deployment
        uses: actions/deploy-pages@v4
