name: LFS Pointer Check

on:
  pull_request:
    paths:
      - friscy-bundle/**
      - .gitattributes
  push:
    branches: [master]
    paths:
      - friscy-bundle/**
      - .gitattributes

jobs:
  lfs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify no LFS pointer stubs in friscy-bundle
        run: |
          echo "Scanning friscy-bundle/ for unresolved Git LFS pointers..."
          fail=0
          # Check every LFS-tracked file that lives under friscy-bundle/
          for f in $(git lfs ls-files -n | grep '^friscy-bundle/'); do
            if [ ! -f "$f" ]; then
              echo "WARN: $f listed in LFS but missing from working tree"
              continue
            fi
            if head -c 40 "$f" | grep -q 'version https://git-lfs'; then
              echo "FAIL: $f is an unresolved LFS pointer ($(wc -c < "$f") bytes)"
              fail=1
            else
              echo "OK:   $f ($(stat --format=%s "$f") bytes)"
            fi
          done

          if [ "$fail" -eq 1 ]; then
            echo ""
            echo "=========================================="
            echo "ERROR: Unresolved LFS pointers detected."
            echo "These files would break the GitHub Pages deployment."
            echo "Fix: run 'git lfs pull' then re-commit the resolved files."
            echo "=========================================="
            exit 1
          fi
          echo ""
          echo "All LFS files in friscy-bundle/ are properly resolved."
