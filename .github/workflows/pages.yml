name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - friscy-bundle/**
      - .github/workflows/pages.yml
      - .gitattributes
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Hydrate required runtime assets (no LFS fetch)
        run: |
          set -euo pipefail
          mkdir -p friscy-bundle
          curl -fL --retry 3 --retry-delay 2 \
            -o friscy-bundle/friscy.js \
            "https://github.com/maceip/friscy/releases/download/runtime-rootfs-assets-20260313/friscy-runtime-good.js"
          curl -fL --retry 3 --retry-delay 2 \
            -o friscy-bundle/friscy.wasm \
            "https://github.com/maceip/friscy/releases/download/runtime-rootfs-assets-20260313/friscy-runtime-good.wasm"
          curl -fL --retry 3 --retry-delay 2 \
            -o friscy-bundle/claude-real.tar \
            "https://github.com/maceip/friscy/releases/download/runtime-rootfs-assets-20260313/claude-real.tar"
          curl -fL --retry 3 --retry-delay 2 \
            -o friscy-bundle/codex-real.tar \
            "https://github.com/maceip/friscy/releases/download/runtime-rootfs-assets-20260313/codex-real.tar"
          curl -fL --retry 3 --retry-delay 2 \
            -o friscy-bundle/gemini-real.tar \
            "https://github.com/maceip/friscy/releases/download/runtime-rootfs-assets-20260313/gemini-real.tar"

      - name: Validate required assets are real binaries
        run: |
          echo "Checking hydrated runtime assets in friscy-bundle/..."
          fail=0
          for f in \
            friscy-bundle/friscy.js \
            friscy-bundle/friscy.wasm \
            friscy-bundle/claude-real.tar \
            friscy-bundle/codex-real.tar \
            friscy-bundle/gemini-real.tar; do
            [ -f "$f" ] || continue
            if head -c 40 "$f" | grep -q 'version https://git-lfs'; then
              echo "ERROR: $f is an unresolved LFS pointer ($(wc -c < "$f") bytes)"
              fail=1
            else
              size=$(stat --format=%s "$f")
              echo "OK: $f ($size bytes)"
            fi
          done
          if [ "$fail" -eq 1 ]; then
            echo ""
            echo "Deploy blocked: required runtime assets were unresolved."
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: friscy-bundle
      - id: deployment
        uses: actions/deploy-pages@v4
